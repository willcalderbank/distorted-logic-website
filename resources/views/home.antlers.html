<section class="hello">
    <div class="container">
        <div class="avatar" aria-hidden="true">{{ profile:initial }}</div>
        <div>
            <h1>{{ hello_title }}</h1>
            {{ if hello_line }}<p>{{ hello_line }}</p>{{ /if }}
        </div>
    </div>
</section>

<section class="projects-section" id="projects">
    <div class="container">
        <div class="section-head">
            <h2>Projects</h2>
            <div class="filters" role="group" aria-label="Filter by tag">
                <button type="button" class="filter" data-tag="all" aria-pressed="true">All</button>
                {{ taxonomy:tags min_count="1" sort="title" }}
                    <button type="button" class="filter" data-tag="{{ slug }}" aria-pressed="false">{{ title }}</button>
                {{ /taxonomy:tags }}
            </div>
        </div>

        <div class="projects" data-projects>
            {{ collection:projects }}
                {{ partial:card }}
            {{ /collection:projects }}
            <p class="empty" data-empty hidden>No projects with that tag.</p>
        </div>
    </div>
</section>
